<!DOCTYPE html>
<html lang="ru" dir="ltr">
  <head>
    <meta charset="utf-8">                            <!-- кодирования, работающая по стандарту Unicode -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="article">       <!-- тип добавляемого материала, например, «article» – статья, «movie» — кино и так далее; -->
    <meta property="og:url" content="{ссылка}">       <!-- ссылка на саму веб-страницу, которая добавляется в социальную сеть -->
    <meta property="og:title" content="название">     <!-- название материала; -->
    <meta property="og:description" content="текст">  <!-- описание материала, заполнять не обязательно; -->
    <meta property="og:image" content="{картинка}">   <!-- ссылка на картинку, которая должна сопровождать материал; -->
    <title>...</title> 
      <link rel="icon" href="./images/favicon.png"> 
      <link href="./stylesheets/style.css" rel="stylesheet" type="text/css"/>
      <script src="./javascripts/java-script.js" charset="utf-8"></script>
  </head>
  <body>


    <button class="countclick"> Нажми на меня </button>
    <p>Количество кликов: <span class="pcount">0</span></p>


    <button class="cobu"> Нажми на меня 2 версия </button>
    <p>Количество кликов: <span class="pco">0</span></p>


    <button class="but"> Нажми на меня 3 версия </button>
    <p>Количество кликов: <span class="point">0</span></p>


    <button class="mi"> - </button>
    <span class="value">0</span>
    <button class="pl"> + </button>

    <p> Секунды: <span class="timer">0</span></p>

    <p> Секунды: <span class="team">0</span></p>


    <p class="hi"> Привет студент УКИ !</p>
    
  </body>
</html>
